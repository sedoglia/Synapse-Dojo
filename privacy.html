        <h1>Privacy e note legali · Synapse Dojo</h1>
        <h2>I tuoi dati restano sul dispositivo</h2>
        <p>Nome, progressi e impostazioni sono salvati solo nel browser di questo dispositivo (localStorage) e non vengono inviati a nessun server, tranne in due casi facoltativi: il riepilogo della classifica settimanale, se aderisci, e la copia temporanea dei progressi, se scegli il trasferimento online con codice (cancellata appena importata e comunque illeggibile dopo 24 ore).</p>
        <h2>Nessun account, nessun cookie</h2>
        <p>Non serve registrarsi e il gioco non usa cookie, pubblicità né strumenti di profilazione. Gli unici servizi esterni sono quelli di Cloudflare indicati sotto.</p>
        <h2>Classifica settimanale facoltativa</h2>
        <p>Solo se aderisci, il gioco invia un riepilogo settimanale legato a un identificativo casuale e a un nickname generato, mai al tuo nome o alla tua email. Al momento dell'adesione Cloudflare Turnstile verifica che tu non sia un robot. I dati vengono cancellati automaticamente dopo poche settimane o subito su richiesta.</p>
        <h2>Hosting e statistiche</h2>
        <p>Il sito è ospitato da Cloudflare Pages; le visite sono contate in forma aggregata con Cloudflare Web Analytics, senza cookie.</p>
        <h2>Non è un dispositivo medico</h2>
        <p>Synapse Dojo è un gioco per svago. Non è un dispositivo medico, non fa diagnosi e non promette di prevenire, rallentare o curare demenza, declino cognitivo o altri problemi di salute. Gli studi citati nella guida riguardano i paradigmi a cui gli esercizi si ispirano, non Synapse Dojo, che non è stato valutato in studi clinici. Per dubbi sulla salute rivolgiti a un medico.</p>
        <p>Progetto indipendente, non collegato a SynapseGym.</p>
