          <h1>Synapse Dojo · Giochi per Allenare la Mente e Brain Training Gratuito</h1>
          <p>Pochi minuti al giorno per allenare la mente: 36 esercizi cognitivi e bilaterali ispirati ai paradigmi della ricerca, per memoria, attenzione, logica, calcolo, riflessi e coordinazione. Solo per svago: non è uno strumento medico.</p>
        </header>
        <main>
          <h2>I 36 Giochi per Allenare la Mente (9 Abilità)</h2>

          <h3>⚡ Velocità</h3>
          <ul>
            <li><strong>Colpo d'occhio:</strong> Velocità di percezione visiva e campo visivo utile, ispirato al compito UFOV del trial ACTIVE.</li>
            <li><strong>Riflesso a scelta:</strong> Tempo di reazione a 4 vie con segnali go/no-go da discriminare.</li>
            <li><strong>Sentiero dei numeri:</strong> Trail Making Test (A e B) per ricerca visiva rapida e flessibilità mentale.</li>
            <li><strong>Tempo di reazione:</strong> Velocità di risposta visuo-motoria semplice al cambio di colore.</li>
          </ul>

          <h3>🎯 Attenzione</h3>
          <ul>
            <li><strong>Pilota:</strong> Multitasking visuo-motorio continuo e discriminazione segnali (ispirato a NeuroRacer).</li>
            <li><strong>Radar:</strong> Multiple Object Tracking (MOT) per tracciare più bersagli in movimento.</li>
            <li><strong>Test di Flanker:</strong> Attenzione selettiva visiva e inibizione delle frecce distrattrici laterali.</li>
            <li><strong>Go / No-Go:</strong> Soppressione rapida della risposta motoria automatica sui segnali di stop.</li>
            <li><strong>Interferenza multipla (MSIT):</strong> Risoluzione di conflitti tra identità del numero e posizione spaziale.</li>
            <li><strong>Colore e forma:</strong> Integrazione di caratteristiche visive (feature binding).</li>
          </ul>

          <h3>🎛️ Controllo (Funzioni Esecutive)</h3>
          <ul>
            <li><strong>Scontro di colori:</strong> Inibizione cognitiva e gestione dell'interferenza dell'effetto Stroop.</li>
            <li><strong>Doppia regola:</strong> Flessibilità cognitiva rapida e riduzione del costo di cambio (task switching).</li>
            <li><strong>Ordinamento di carte:</strong> Ispirato al Wisconsin Card Sorting Test (WCST), induzione di regole segrete e set-shifting.</li>
          </ul>

          <h3>🧠 Memoria di Lavoro</h3>
          <ul>
            <li><strong>Eco:</strong> Test N-Back visivo e duale (posizione e lettera pronunciata) per la memoria di lavoro.</li>
            <li><strong>Griglia di luci:</strong> Test dei blocchi di Corsi in avanti e all'indietro per la memoria visuo-spaziale.</li>
            <li><strong>Ultime cifre:</strong> Running span per l'aggiornamento dinamico delle informazioni in memoria.</li>
            <li><strong>Span di cifre:</strong> Digit span in avanti e all'indietro per la capacità di memoria a breve termine verbale.</li>
          </ul>

          <h3>🔐 Memoria</h3>
          <ul>
            <li><strong>Cassaforte di parole:</strong> Memoria di riconoscimento vecchio/nuovo e memoria episodica verbale.</li>
            <li><strong>Coppie:</strong> Associazioni di coppie simbolo-parola (paired associates).</li>
            <li><strong>Memoria delle storie:</strong> Richiamo narrativo episodico su personaggi, luoghi e tempi.</li>
          </ul>

          <h3>🧊 Spaziale</h3>
          <ul>
            <li><strong>Rotazioni:</strong> Rotazione mentale di figure 2D per verificare specularità o identità.</li>
            <li><strong>Matrice spaziale:</strong> Memorizzazione di pattern e ricostruzione dopo rotazioni di coordinate a 90°, 180° e 270°.</li>
          </ul>

          <h3>🧩 Ragionamento</h3>
          <ul>
            <li><strong>Torri:</strong> Ispirato alla Torre di Londra, pianificazione logica anticipata delle mosse minime.</li>
            <li><strong>L'intruso:</strong> Ragionamento induttivo e scoperta della regola tra figure geometriche dissimili.</li>
            <li><strong>Banco del mercato:</strong> Problema dello zaino: la combinazione migliore di costi e guadagni entro un budget.</li>
                      </ul>

          <h3>➗ Calcolo e Lettura</h3>
          <ul>
            <li><strong>Sprint di calcolo:</strong> Aritmetica mentale rapida secondo il paradigma di learning therapy (metodo Kawashima).</li>
            <li><strong>Lettura veloce:</strong> Lettura ad alta voce con cronometro e verifica di comprensione del testo.</li>
            <li><strong>Calcolo con i punti:</strong> Stima immediata della numerosità senza contare (sistema numerico approssimato).</li>
            <li><strong>Anagrammi:</strong> Memoria ortografica e ricombinazione mentale lessicale.</li>
            <li><strong>Sprint di parole:</strong> Riconoscere in fretta le parole che iniziano con la lettera indicata.</li>
          </ul>

          <h3>👐 Coordinazione Bilaterale</h3>
          <ul>
            <li><strong>Tap bilaterale:</strong> Sequenze di tocchi alternati tra mano sinistra e destra, per allenare la coordinazione bimanuale.</li>
            <li><strong>Swipe bilaterale:</strong> Gesti direzionali simultanei asimmetrici per il disaccoppiamento motorio.</li>
            <li><strong>Ritmo bilaterale:</strong> Sincronizzazione ritmica bimanuale su metronomo visivo.</li>
            <li><strong>Movimenti incrociati:</strong> Risposte sullo stesso lato o su quello opposto (compatibilità stimolo-risposta).</li>
            <li><strong>Dual-Task bilaterale:</strong> Gestione asimmetrica di compiti contemporanei (mantenimento motorio + decisione cognitiva).</li>
          </ul>
