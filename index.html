          <h1>Synapse Dojo · Giochi per Allenare la Mente e Brain Training Gratuito</h1>
          <p>Pochi minuti al giorno per una mente più agile: 17 esercizi cognitivi basati sulle neuroscienze per memoria, attenzione, logica e riflessi.</p>
        </header>
        <main>
          <h2>I 17 Giochi Scientifici per Allenare la Mente</h2>
          <ul>
            <li><strong>Colpo d'occhio:</strong> Allena la velocità di percezione visiva e il campo visivo utile (studio ACTIVE).</li>
            <li><strong>Riflesso a scelta:</strong> Tempo di reazione rapido e inibizione go/no-go.</li>
            <li><strong>Sentiero dei numeri:</strong> Trail Making Test per flessibilità mentale e ricerca visiva.</li>
            <li><strong>Pilota:</strong> Multitasking e coordinazione visuo-motoria (ispirato a NeuroRacer).</li>
            <li><strong>Radar:</strong> Multiple Object Tracking per attenzione spaziale diffusa.</li>
            <li><strong>Scontro di colori:</strong> Inibizione cognitiva ed effetto Stroop.</li>
            <li><strong>Doppia regola:</strong> Flessibilità mentale e task switching rapido.</li>
            <li><strong>Eco:</strong> Memoria di lavoro uditiva e visiva (N-Back).</li>
            <li><strong>Griglia:</strong> Memoria di lavoro visuo-spaziale (Corsi blocks).</li>
            <li><strong>Cifre:</strong> Span di memoria verbale e numerica inversa.</li>
            <li><strong>Cassaforte:</strong> Memoria associativa e combinatoria.</li>
            <li><strong>Coppie:</strong> Memory visivo a carte coperte.</li>
            <li><strong>Rotazione:</strong> Rotazione mentale di figure 2D e 3D.</li>
            <li><strong>Torri:</strong> Pianificazione logica e problem solving (Torre di Hanoi).</li>
            <li><strong>Intruso:</strong> Categorizzazione visiva e ragionamento induttivo.</li>
            <li><strong>Calcolo rapido:</strong> Aritmetica mentale sotto pressione temporale.</li>
            <li><strong>Lettura veloce:</strong> Comprensione rapida del testo (RSVP).</li>
          </ul>
