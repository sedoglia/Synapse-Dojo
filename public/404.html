<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#5b5bf0" />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <title>404 · Synapse Dojo</title>
    <!-- Its presence also tells Cloudflare Pages to answer missing files with a real 404 instead of the home page. -->
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #f4f5fb;
        color: #1f2340;
        font: 18px/1.5 system-ui, sans-serif;
        text-align: center;
      }
      a {
        display: inline-block;
        margin-top: 12px;
        padding: 12px 22px;
        border-radius: 12px;
        background: #5b5bf0;
        color: #fff;
        text-decoration: none;
        font-weight: 700;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #14162b;
          color: #e8e9f5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div style="font-size: 3rem">🧠</div>
      <h1>Page not found · Pagina non trovata</h1>
      <a href="/">Synapse Dojo</a>
    </main>
  </body>
</html>
