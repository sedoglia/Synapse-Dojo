# Cloudflare Pages configuration: static site in dist/ plus the opt-in leaderboard API in functions/.
# Once this file exists it is the source of truth for the project's bindings (the dashboard settings are ignored).
name = "synapse-gym"
pages_build_output_dir = "dist"
compatibility_date = "2026-06-01"

# Leaderboard database (created with `npx wrangler d1 create synapse-board`); `npm run dev:api` uses a local copy.
[[d1_databases]]
binding = "DB"
database_name = "synapse-board"
database_id = "19f20144-0d17-484c-b0ee-85e34c702f30"
migrations_dir = "migrations"
